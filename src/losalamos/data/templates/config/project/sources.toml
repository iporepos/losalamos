# Project sources configuration.
#
# Paths may be absolute or relative to the working directory.

# Directories scanned for .md notes matched against project metadata fields.
[folders.search]
# NoteOrganization notes — companies, institutes, government bodies.
# Matched against the 'contractor' and 'client' fields.
organizations = []
# NoteSapiens notes — individual persons.
# Matched against 'contractor', 'contractor_sapiens', and 'client' fields.
sapiens = []
# NoteBasic notes for services, each named by its service_id.
# The service display name is read from the note's 'abstract' field.
services = []

# Remote vault roots. When set, the project mirrors its inputs/ subfolders
# there. Leave blank to keep everything local.
[folders.remote]
documents = ""
data = ""

# Template overlay directories, keyed by document type.
# Each value is a path to a folder whose files override the built-in template.
[templates.documents]
invoice = ""
receipt = ""
proposal = ""
